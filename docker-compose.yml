services:
  company-frontend:
    build:
      context: ./company-frontend
      dockerfile: Dockerfile

    container_name: park-pilot-company-portal

    depends_on:
      api:
        condition: service_started

    environment:
      API_UPSTREAM: "http://api:8080"

    ports:
      - "8083:8080"

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  marketing-frontend:
    build:
      context: ./marketing-frontend
      dockerfile: Dockerfile

    container_name: park-pilot-marketing

    depends_on:
      api:
        condition: service_started

    environment:
      API_UPSTREAM: "http://api:8080"

    ports:
      - "8082:8080"

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: queue-times-frontend

    depends_on:
      api:
        condition: service_started

    environment:
      API_UPSTREAM: "http://api:8080"

    ports:
      - "8081:8080"

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Disney.Api/Dockerfile
      secrets:
        - nuget_credentials

    container_name: queue-times-api

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=queue_times;Username=queue_user;Password=queue_password"
      Stripe__SecretKey: "${STRIPE_SECRET_KEY:-}"
      Stripe__WebhookSecret: "${STRIPE_WEBHOOK_SECRET:-}"
      Stripe__SuccessUrl: "${STRIPE_SUCCESS_URL:-http://localhost:8082/checkout?status=success}"
      Stripe__CancelUrl: "${STRIPE_CANCEL_URL:-http://localhost:8082/checkout?status=cancelled}"
      Stripe__VisitPassPriceId: "${STRIPE_VISIT_PASS_PRICE_ID:-}"
      Stripe__TripPassPriceId: "${STRIPE_TRIP_PASS_PRICE_ID:-}"
      Stripe__CompanySuccessUrl: "${STRIPE_COMPANY_SUCCESS_URL:-http://localhost:8083/billing?status=success}"
      Stripe__CompanyCancelUrl: "${STRIPE_COMPANY_CANCEL_URL:-http://localhost:8083/billing?status=cancelled}"
      Stripe__CompanyCreditBundles__starter__PriceId: "${STRIPE_COMPANY_STARTER_PRICE_ID:-}"
      Stripe__CompanyCreditBundles__starter__Credits: "25"
      Stripe__CompanyCreditBundles__starter__DisplayName: "25 visit credits"
      Stripe__CompanyCreditBundles__growth__PriceId: "${STRIPE_COMPANY_GROWTH_PRICE_ID:-}"
      Stripe__CompanyCreditBundles__growth__Credits: "100"
      Stripe__CompanyCreditBundles__growth__DisplayName: "100 visit credits"

    ports:
      - "8080:8080"

    labels:
      logs.collect: "true"

    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Worker/Dockerfile
      secrets:
        - nuget_credentials

    container_name: queue-times-worker

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=queue_times;Username=queue_user;Password=queue_password"

    labels:
      logs.collect: "true"

    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: queue-times-postgres

    environment:
      POSTGRES_DB: queue_times
      POSTGRES_USER: queue_user
      POSTGRES_PASSWORD: queue_password

    ports:
      - "5432:5432"

    volumes:
      - queue_times_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queue_user -d queue_times"]
      interval: 10s
      timeout: 5s
      retries: 5

    labels:
      logs.collect: "true"

    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.6
    container_name: queue-times-loki
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki.yml:/etc/loki/config.yml:ro
      - queue_times_loki_data:/loki
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-version"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.18.1
    container_name: queue-times-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      loki:
        condition: service_healthy
    ports:
      - "12345:12345"
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - queue_times_alloy_data:/var/lib/alloy/data
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: queue-times-grafana
    depends_on:
      loki:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning/datasources/loki.yml:/etc/grafana/provisioning/datasources/loki.yml:ro
      - queue_times_grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped


volumes:
  queue_times_postgres_data:
  queue_times_loki_data:
  queue_times_alloy_data:
  queue_times_grafana_data:


secrets:
  nuget_credentials:
    environment: NUGET_NORDICTECH_CREDENTIALS